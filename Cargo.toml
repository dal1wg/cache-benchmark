[workspace]
resolver = "2"
members = [
    "crates/cb-histogram",
    "crates/cache-benchmark",
    "crates/cache-bench-ctl",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
cb-histogram = { path = "crates/cb-histogram" }
tokio = { version = "1", features = ["full"] }
redis = { version = "0.32", features = [
    "tokio-comp",
    "cluster",
    "cluster-async",
] }
futures = "0.3"
rand = "0.8.5"
rand_distr = "0.4.3"
nom = "7.1.3"
core_affinity = "0.8.1"
awaitgroup = "0.7.0"
colored = "2.1.0"
enum_delegate = "0.2.0"
ctrlc = "3.4.4"
urlencoding = "2.1.3"
governor = "0.10.0"
mlua = { version = "0.11", features = ["lua54", "send", "serde", "serialize", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
