[package]
name = "cache-benchmark-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unit / functional / integration tests for cache-benchmark and cache-bench-ctl"
publish = false

[lib]
name = "cache_benchmark_tests"
path = "src/lib.rs"

[dependencies]
