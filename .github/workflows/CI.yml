name: CI

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_prefix: cache-benchmark
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_prefix: cache-benchmark
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_prefix: cache-benchmark
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_prefix: cache-benchmark
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_prefix: cache-benchmark
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build workers
        run: cargo build --release --target ${{ matrix.target }} -p cache-benchmark
      - name: Build ctl (with russh transport)
        run: cargo build --release --target ${{ matrix.target }} -p cache-bench-ctl --features russh
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          TRIPLE=${{ matrix.target }}
          cp target/$TRIPLE/release/cache-benchmark dist/cache-benchmark-$TRIPLE
          cp target/$TRIPLE/release/cache-bench-ctl dist/cache-bench-ctl-$TRIPLE
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ matrix.target }}
          path: dist

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: tests
      - name: Run tests
        run: cargo test --workspace

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
