name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use official crates.io (runner is overseas; repo default is rsproxy.cn mirror)
        shell: bash
        run: rm -f .cargo/config.toml
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # 安装交叉编译工具链（CC/linker 等），覆盖：
      # - x86_64/aarch64 musl（musl-gcc / aarch64-linux-musl-gcc，mlua vendored Lua 必需）
      # - macOS x86_64（ARM runner 上交叉编译，clang -arch x86_64）
      - name: Setup cross toolchain
        if: runner.os != 'Windows'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build workers
        run: cargo build --release --target ${{ matrix.target }} -p cache-benchmark
      - name: Build ctl (with russh transport)
        run: cargo build --release --target ${{ matrix.target }} -p cache-bench-ctl --features russh
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          TRIPLE=${{ matrix.target }}
          EXT=""
          if [[ "$TRIPLE" == *windows* ]]; then EXT=".exe"; fi
          cp "target/$TRIPLE/release/cache-benchmark$EXT" "dist/cache-benchmark-$TRIPLE$EXT"
          cp "target/$TRIPLE/release/cache-bench-ctl$EXT" "dist/cache-bench-ctl-$TRIPLE$EXT"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cache-benchmark-${{ matrix.target }}
          path: dist

  test:
    name: Test (unit + functional + standalone-integration)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_HOST: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - name: Use official crates.io (runner is overseas; repo default is rsproxy.cn mirror)
        shell: bash
        run: rm -f .cargo/config.toml
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: tests
      - name: Build binaries (functional tests spawn them)
        run: cargo build -p cache-benchmark -p cache-bench-ctl
      - name: Unit + functional tests
        run: cargo test --workspace
      - name: Standalone integration tests (redis service)
        run: cargo test -p cache-benchmark-tests --test integration_standalone --test integration_lua_real -- --ignored
        env:
          REDIS_HOST: 127.0.0.1:6379

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
